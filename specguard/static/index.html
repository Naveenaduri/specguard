<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpecGuard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --bg2:#0a0f1a; --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#e8edf8; --muted:#7d8aa5; --dim:#4c5871;
  --cyan:#38e1ff; --violet:#8b7bff; --green:#3dffb0; --red:#ff4d73; --amber:#ffc15a;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,123,255,.16),transparent 60%),radial-gradient(800px 500px at -5% 105%,rgba(56,225,255,.10),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 72%)}
a{color:var(--cyan)} button{font:inherit;cursor:pointer;color:inherit}
.mono{font-family:var(--mono)} .muted{color:var(--muted)} .hide{display:none!important}

header{display:flex;align-items:center;gap:16px;height:60px;padding:0 28px;position:sticky;top:0;z-index:40;
  background:rgba(5,7,13,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.2px;cursor:pointer}
.logo svg{width:26px;height:26px}
.logo b{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
nav{display:flex;gap:4px} nav button{background:none;border:0;padding:7px 13px;border-radius:9px;color:var(--muted);font-weight:500}
nav button:hover,nav button.on{color:var(--text);background:var(--glass2)}
.chip{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border:1px solid var(--line);border-radius:99px;background:var(--glass)}
.chip img{width:26px;height:26px;border-radius:50%} .chip span{font-size:13px;font-weight:500}
.chip button{background:none;border:0;color:var(--muted);padding:2px 8px;font-size:12px}

.btn{border:1px solid var(--line2);background:var(--glass);color:var(--text);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.18s}
.btn:hover{border-color:var(--cyan);background:var(--glass2)}
.btn.primary{background:linear-gradient(135deg,#2bc4e8,#7a6bff);border:0;color:#fff;box-shadow:0 8px 28px -10px rgba(122,107,255,.8)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.good{background:var(--green);border:0;color:#03271a} .btn.bad{background:var(--red);border:0;color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px} .btn:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:36px 28px 120px}
main.wide{max-width:none;padding:18px 22px 24px}
h1,h2,h3{margin:0;letter-spacing:-.02em} h2{font-size:26px;font-weight:700} .sub{color:var(--muted);margin:6px 0 22px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px;font-family:var(--mono)}
input,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:var(--text);border-radius:11px;padding:11px 14px;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.14)}
textarea{min-height:90px;resize:vertical}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(8px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{background:rgba(255,193,90,.08);border:1px solid rgba(255,193,90,.35);color:var(--amber);border-radius:12px;padding:12px 15px;margin-top:16px}

/* ---------- hero + home ---------- */
.hero{text-align:center;padding:70px 0 10px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:18px}
.hero h1{font-size:clamp(36px,6vw,60px);line-height:1.04;font-weight:800;letter-spacing:-.035em}
.grad{background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:17px;max-width:600px;margin:20px auto 30px}
.cta{display:inline-block;text-decoration:none;padding:14px 28px;font-size:15.5px;border-radius:12px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-top:38px}
.act{position:relative;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:26px;transition:.25s;overflow:hidden}
.act::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 20% 0%,var(--tint,rgba(56,225,255,.12)),transparent 70%);opacity:.8;transition:.25s}
.act:hover{transform:translateY(-4px);border-color:var(--line2)} .act:hover::before{opacity:1}
.act>*{position:relative} .act svg{width:34px;height:34px;color:var(--c,var(--cyan));margin-bottom:16px}
.act h3{font-size:18px;font-weight:650;margin-bottom:6px} .act p{margin:0;color:var(--muted);font-size:13.5px}
.recent{margin-top:44px} .recent h3{font-size:12px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:500}
.rrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--glass);cursor:pointer;transition:.15s}
.rrow:hover{border-color:var(--line2);background:var(--glass2)} .rrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);white-space:nowrap}
.pill.ok{color:var(--green);border-color:rgba(61,255,176,.4)} .pill.no{color:var(--amber);border-color:rgba(255,193,90,.4)} .pill.cy{color:var(--cyan);border-color:rgba(56,225,255,.4)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* ---------- explore ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px;max-width:380px} .search input{padding-left:38px;background:var(--glass)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fc{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12.5px;color:var(--muted);transition:.15s;display:flex;gap:6px;align-items:center}
.fc:hover{color:var(--text);border-color:var(--line2)} .fc.on{color:var(--text);border-color:var(--cyan);background:rgba(56,225,255,.1)}
.seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:6px 14px;border-radius:7px;color:var(--muted);font-size:13px;font-weight:500}
.seg button.on{background:var(--glass2);color:var(--text)}
.stage{position:relative;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:radial-gradient(700px 400px at 50% 45%,rgba(139,123,255,.09),transparent 70%),rgba(4,6,11,.6)}
canvas{width:100%;height:100%;display:block;cursor:grab} canvas.grabbing{cursor:grabbing}
.key{position:absolute;left:16px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-family:var(--mono);background:rgba(5,7,13,.7);padding:8px 12px;border-radius:10px;border:1px solid var(--line);backdrop-filter:blur(6px)}
.key i{display:inline-block;width:16px;height:2px;margin-right:6px;vertical-align:middle;border-radius:2px}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;background:rgba(5,7,13,.75);border:1px solid var(--line2);font-size:16px}
.zoom button:hover{border-color:var(--cyan)}
.tip{position:absolute;pointer-events:none;display:none;z-index:6;max-width:270px;background:rgba(8,12,22,.94);border:1px solid var(--line2);border-radius:12px;padding:10px 13px;font-size:12.5px;backdrop-filter:blur(8px)}
.tip b{font-size:13.5px} .tip .muted{display:block;margin-top:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:13px}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.rc{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:10px}
.rc:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--glass2)}
.rc .n{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px} .rc .n small{color:var(--muted);font-weight:400}
.rc .d{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.rc .st{display:flex;gap:14px;color:var(--muted);font-size:12px;font-family:var(--mono);flex-wrap:wrap}
.rc .tags{display:flex;gap:6px;flex-wrap:wrap}

#drawer{position:fixed;top:72px;right:16px;bottom:16px;width:392px;max-width:calc(100vw - 32px);z-index:35;transform:translateX(115%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  background:rgba(8,12,22,.9);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:20px;overflow:auto;padding:22px;box-shadow:0 30px 80px -20px #000}
#drawer.open{transform:none}
.dh{display:flex;align-items:flex-start;gap:10px} .dh h3{font-size:19px;font-weight:700;word-break:break-word} .dh small{color:var(--muted);display:block}
.x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px} .stat b{display:block;font-size:17px;font-weight:700} .stat span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:20px 0 9px}
.rel{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:11px;margin-bottom:6px;cursor:pointer;background:var(--glass);transition:.15s}
.rel:hover{border-color:var(--line2);background:var(--glass2)} .rel b{font-weight:600;font-size:13.5px} .rel small{color:var(--muted);margin-left:auto;font-size:11.5px;text-align:right}
pre.sum{white-space:pre-wrap;font:13px/1.6 var(--sans);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:13px;margin:0}
.crow{display:flex;gap:9px;font-size:12.5px;padding:3px 0;color:var(--muted)} .crow .mono{color:var(--cyan)}

/* ---------- run view ---------- */
.rail{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px}
.st2{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:12.5px;color:var(--dim);transition:.3s}
.st2.active{color:var(--text);border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,123,255,.2);animation:pulse 1.4s infinite}
.st2.done{color:var(--green);border-color:rgba(61,255,176,.4)} .st2.failed{color:var(--red);border-color:var(--red)} .st2.wait{color:var(--amber);border-color:var(--amber)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(139,123,255,.06)}}
.feed{display:flex;flex-direction:column;gap:12px;max-width:860px}
.ev{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 17px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ev .t{font-weight:600;display:flex;gap:8px;align-items:center} .ev .d{color:var(--muted);font-size:13px;white-space:pre-wrap;margin-top:4px}
.ev.small{padding:6px 14px;background:transparent;border-style:dashed;border-color:var(--line)} .ev.small .t{font-weight:400;color:var(--muted);font-size:13px}
.clause{border-left:2px solid var(--violet);background:rgba(0,0,0,.25);border-radius:9px;padding:10px 13px;margin-top:9px;font-size:13px}
.clause q{display:block;font-style:italic;margin:4px 0} .clause .meta{color:var(--muted);font-size:12px}
.lv{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;background:rgba(139,123,255,.2);color:var(--violet);margin-right:7px;font-family:var(--mono)}
.lv.MUST,.lv.MUSTNOT{background:rgba(255,77,115,.15);color:var(--red)} .lv.SHOULD{background:rgba(255,193,90,.15);color:var(--amber)}
.red{border-color:rgba(255,77,115,.6);background:linear-gradient(180deg,rgba(255,77,115,.1),var(--glass));animation:in .35s ease,flash 1.1s ease 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 0 rgba(255,77,115,.5)}30%{box-shadow:0 0 0 12px rgba(255,77,115,0)}}
.violation{border:1.5px solid var(--red);background:linear-gradient(180deg,rgba(255,77,115,.18),rgba(255,77,115,.04));border-radius:16px;padding:18px 20px;animation:in .4s ease,shake .5s ease 1;box-shadow:0 0 50px -15px rgba(255,77,115,.6)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.violation h4{margin:0 0 8px;color:var(--red);font-size:14px;letter-spacing:.14em;font-family:var(--mono)} .violation q{display:block;font-size:15px;margin:8px 0 12px}
.out{background:rgba(0,0,0,.5);border-radius:10px;padding:11px;color:#ffb8c6;overflow:auto;max-height:170px;white-space:pre-wrap;font-family:var(--mono);font-size:12px;margin:7px 0}
.green{border-color:rgba(61,255,176,.45);background:linear-gradient(180deg,rgba(61,255,176,.09),var(--glass))}
.flip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:9px;font-size:12px}
.flip .b{background:rgba(255,77,115,.1);border:1px solid rgba(255,77,115,.35);color:#ffb3c0;border-radius:9px;padding:7px 10px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flip .a{background:rgba(61,255,176,.1);border:1px solid rgba(61,255,176,.4);color:var(--green);border-radius:9px;padding:7px 10px;font-family:var(--mono)}
.gate{border-color:rgba(255,193,90,.5);background:rgba(255,193,90,.05)} .gate textarea{margin-top:11px}
.diff{background:rgba(0,0,0,.5);border-radius:10px;padding:11px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:210px;white-space:pre;margin-top:8px}
.diff .p{color:var(--green)} .diff .m{color:var(--red)} .big{font-size:20px;font-weight:700}

/* ---------- chat ---------- */
#chatBtn{position:fixed;right:22px;bottom:22px;z-index:50;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,#2bc4e8,#7a6bff);color:#fff;box-shadow:0 14px 34px -8px rgba(122,107,255,.9)}
#chatBtn svg{width:24px;height:24px}
#chat{position:fixed;right:22px;bottom:88px;width:376px;max-width:calc(100vw - 44px);height:480px;z-index:50;display:none;flex-direction:column;background:rgba(8,12,22,.94);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px #000}
#chat.open{display:flex}
#chat .ch{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 13px;border-radius:14px;font-size:13.5px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:linear-gradient(135deg,#2bc4e8,#7a6bff);color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--glass2);border-bottom-left-radius:4px}
#chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')">
    <svg viewBox="0 0 32 32" fill="none"><path d="M16 2l11 4v9c0 7-4.6 12.2-11 15C9.6 27.200 5 22 5 15V6l11-4z" stroke="url(#g)" stroke-width="1.8"/><circle cx="16" cy="11" r="2.2" fill="#38e1ff"/><circle cx="11" cy="19" r="2" fill="#8b7bff"/><circle cx="21" cy="19" r="2" fill="#3dffb0"/><path d="M16 13l-4 5M16 13l4 5M13 19h6" stroke="#9fb0d4" stroke-width="1"/><defs><linearGradient id="g" x1="5" y1="2" x2="27" y2="30"><stop stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient></defs></svg>
    <b>SpecGuard</b>
  </div>
  <nav id="nav" class="hide"><button data-v="home" onclick="go('home')">Home</button><button data-v="explore" onclick="go('explore')">Explore</button><button data-v="read" onclick="go('read')">Read</button><button data-v="build" onclick="go('build')">Build</button></nav>
  <div class="sp"></div>
  <div class="chip hide" id="userChip"><img id="avatar" alt=""><span id="uname"></span><button onclick="logout()">Sign out</button></div>
</header>
<main id="app"></main>
<aside id="drawer"></aside>

<button id="chatBtn" class="hide" onclick="toggleChat()" aria-label="Chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
<div id="chat">
  <div class="ch">Ask SpecGuard<span class="sp"></span><span class="muted mono" id="chatCtx" style="font-size:11px"></span><button class="btn sm" onclick="toggleChat()">✕</button></div>
  <div id="msgs"></div>
  <form onsubmit="sendChat(event)"><input id="chatIn" placeholder="Ask about a repo or how a run works…" autocomplete="off"><button class="btn primary sm">Send</button></form>
</div>

<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null,G=null,SELECTED=null,ES=null,CHAT=[],GR=null,VIEW='graph',FILTER={q:'',chip:'all'};
const api=async(u,o)=>{const r=await fetch(u,o&&o.body?{...o,headers:{'Content-Type':'application/json'}}:o);if(r.status===401)throw new Error('401');if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.json()};
const post=(u,b)=>api(u,{method:'POST',body:JSON.stringify(b)});
const LANG={Python:'#4f8cff',TypeScript:'#38bdf8',JavaScript:'#facc15',Go:'#22d3ee',Rust:'#fb923c',Java:'#f87171','C++':'#f472b6',C:'#94a3b8','C#':'#a78bfa',Ruby:'#fb7185',Shell:'#86efac',HTML:'#fb923c',CSS:'#a78bfa',Jupyter:'#fdba74','Jupyter Notebook':'#fdba74',Kotlin:'#c084fc',Swift:'#fb923c'};
const langColor=l=>l?(LANG[l]||'#'+[...l].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7).toString(16).padStart(6,'0').slice(0,6)):'#5b6785';
const CL=['#38e1ff','#8b7bff','#3dffb0','#ffc15a','#ff6fb1','#7dd3fc','#c4f542','#ff8a5b'];

/* ---------- the graph engine ---------- */
function makeGraph(cv,G){

  const idx={},nodes=G.repos.map((r,i)=>{const age=(Date.now()-new Date(r.pushed_at||0))/864e5;
    const n={r,i,x:0,y:0,vx:0,vy:0,rad:Math.min(30,9+Math.sqrt(r.stars*5+r.size/1800+r.issues*2.5+1)*2.1),c:langColor(r.language),
      cl:Math.max(0,G.clusters.findIndex(c=>c.id===G.assign[r.full_name])),fresh:age<14,dim:1};idx[r.full_name]=n;return n});

  function layoutCenters(){const n=G.clusters.length,R=Math.min(W,H)*(n>1?.40:0);centers.length=0;
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2;centers.push({x:W/2+Math.cos(a)*R*1.7,y:H/2+Math.sin(a)*R})}
    nodes.forEach((nd,j)=>{if(!nd.x){const c=centers[nd.cl]||{x:W/2,y:H/2};nd.x=c.x+(Math.random()-.5)*120;nd.y=c.y+(Math.random()-.5)*120}})}

  const LEN={fork:60,same:70,name:105,topic:135,ai:150};

    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
      const m=a.rad+b.rad+(a.cl===b.cl?26:120);if(d<m*2){const f=(m*2-d)*.016*alpha+(d<m?(m-d)*.05:0);dx/=d;dy/=d;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f}}
    for(const e of edges){let dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1;const f=(d-(LEN[e.type]||120))*.012*e.w;dx/=d;dy/=d;e.a.vx+=dx*f;e.a.vy+=dy*f;e.b.vx-=dx*f;e.b.vy-=dy*f}

    alpha=Math.max(.04,alpha*.992)}
  const toWorld=(sx,sy)=>[(sx-cam.x)/cam.k,(sy-cam.y)/cam.k];
  function bounds(){let a=1e9,b=1e9,c=-1e9,d=-1e9;geom.forEach(g=>{if(!g)return;a=Math.min(a,g.cx-g.r-10);b=Math.min(b,g.cy-g.r-34);c=Math.max(c,g.cx+g.r+10);d=Math.max(d,g.cy+g.r+10)});if(geom.length)return[a,b,c,d];nodes.forEach(n=>{a=Math.min(a,n.x-n.rad-110);b=Math.min(b,n.y-n.rad-130);c=Math.max(c,n.x+n.rad+110);d=Math.max(d,n.y+n.rad+110)});return[a,b,c,d]}
  let auto=true;const target=()=>{const [a,b,c,d]=bounds(),k=Math.min(W/(c-a),H/(d-b),1.6);return{k,x:(W-(c-a)*k)/2-a*k,y:(H-(d-b)*k)/2-b*k}};

      const cx=ms.reduce((s,n)=>s+n.x,0)/ms.length,cy=ms.reduce((s,n)=>s+n.y,0)/ms.length,r=Math.max(...ms.map(n=>Math.hypot(n.x-cx,n.y-cy)+n.rad))+44,col=CL[ci%CL.length];geom[ci]={cx,cy,r};

    // edges
    edges.forEach(e=>{const inc=f&&(e.a===f||e.b===f),dimmed=f&&!inc,col=EDGE[e.type][0],vis=Math.min(e.a.dim,e.b.dim);
      const mx=(e.a.x+e.b.x)/2,my=(e.a.y+e.b.y)/2,dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,len=Math.hypot(dx,dy)||1,ox=-dy/len*len*.12,oy=dx/len*len*.12;
      ctx.globalAlpha=(dimmed?.04:inc?.95:.3)*(.3+vis*.7);ctx.strokeStyle=col;ctx.lineWidth=(.8+e.w*1.3+(inc?1:0))/Math.sqrt(cam.k);
      ctx.setLineDash(e.type==='ai'?[5,5]:[]);ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.quadraticCurveTo(mx+ox,my+oy,e.b.x,e.b.y);ctx.stroke();ctx.setLineDash([]);
      if(inc){const p=((t/1400)+e.a.i*.13)%1,q=1-p;ctx.fillStyle=col;ctx.beginPath();
        ctx.arc(q*q*e.a.x+2*q*p*(mx+ox)+p*p*e.b.x,q*q*e.a.y+2*q*p*(my+oy)+p*p*e.b.y,3/Math.sqrt(cam.k),0,7);ctx.fill();
        ctx.globalAlpha=1;ctx.fillStyle='#e8edf8';ctx.font=`500 ${10.5/Math.sqrt(cam.k)}px JetBrains Mono,monospace`;ctx.textAlign='center';ctx.fillText(e.why,mx+ox*.5,my+oy*.5-5/cam.k)}});
    ctx.globalAlpha=1;
    // nodes
    nodes.forEach(n=>{const isSel=sel===n,isH=hover===n,rel=!f||near.has(n),a=(rel?1:.18)*(.25+n.dim*.75);
      ctx.globalAlpha=a;const gr=ctx.createRadialGradient(n.x,n.y,n.rad*.3,n.x,n.y,n.rad*(isSel||isH?3:2.2));gr.addColorStop(0,n.c+'66');gr.addColorStop(1,n.c+'00');

      if(!n.r.write){ctx.setLineDash([1,4]);ctx.strokeStyle='#ffc15a';ctx.lineWidth=1.6/cam.k;ctx.beginPath();ctx.arc(n.x,n.y,n.rad+5,0,7);ctx.stroke();ctx.setLineDash([])}
      if(n.r.private){ctx.setLineDash([3,3]);ctx.strokeStyle='#e8edf8';ctx.lineWidth=1.2/cam.k;ctx.beginPath();ctx.arc(n.x,n.y,n.rad+8,0,7);ctx.stroke();ctx.setLineDash([])}
      if(isSel){ctx.strokeStyle='#fff';ctx.lineWidth=2/cam.k;ctx.beginPath();ctx.arc(n.x,n.y,n.rad+3,0,7);ctx.stroke()}
      if(isSel||isH||(f&&near.has(n))||n.rad*cam.k>15||cam.k>1.3){ctx.globalAlpha=Math.max(a,isSel||isH?1:0);ctx.fillStyle='#e8edf8';ctx.font=`600 ${12/Math.max(cam.k,.7)}px Inter,sans-serif`;ctx.textAlign='center';
        ctx.fillText(n.r.name.length>20?n.r.name.slice(0,19)+'…':n.r.name,n.x,n.y+n.rad+16/Math.max(cam.k,.7))}
      ctx.globalAlpha=1});
  }
  function loop(t){if(!alive)return;frames++;if(alpha>.045||drag)tick();if(auto&&frames>20){const t=target(),e=frames<60?1:.07;cam.k+=(t.k-cam.k)*e;cam.x+=(t.x-cam.x)*e;cam.y+=(t.y-cam.y)*e}
    nodes.forEach(n=>{const tgt=filt(n.r)?1:0;n.dim+=(tgt-n.dim)*.12});paint(t);requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  const hit=(sx,sy)=>{const [x,y]=toWorld(sx,sy);return nodes.slice().reverse().find(n=>n.dim>.3&&Math.hypot(n.x-x,n.y-y)<=n.rad+7)};
  let moved=false;
  cv.onmousedown=e=>{const [sx,sy]=pos(e);const n=hit(sx,sy);moved=false;if(n){drag=n;alpha=Math.max(alpha,.35)}else{auto=false;pan={x:sx,y:sy,cx:cam.x,cy:cam.y};cv.classList.add('grabbing')}};
  addEventListener('mouseup',e=>{if(!alive)return;const n=drag;drag=null;const wasPan=pan;pan=null;cv.classList.remove('grabbing');
    if(n&&!moved){pick(n.r.full_name)}else if(wasPan&&!moved){sel=null;closeDrawer()}});
  cv.onmousemove=e=>{const [sx,sy]=pos(e);moved=true;
    if(drag){[drag.x,drag.y]=toWorld(sx,sy);drag.vx=drag.vy=0;return}
    if(pan){cam.x=pan.cx+sx-pan.x;cam.y=pan.cy+sy-pan.y;return}
    const n=hit(sx,sy);hover=n||null;cv.style.cursor=n?'pointer':'';const tip=$('#tip');
    if(n){tip.style.display='block';tip.style.left=Math.min(sx+16,W-280)+'px';tip.style.top=Math.min(sy+16,H-110)+'px';
      tip.innerHTML=`<b>${esc(n.r.name)}</b><span class="muted">${esc((n.r.description||'No description').slice(0,110))}</span><span class="muted mono" style="margin-top:6px">${esc(n.r.language||'—')} · ★ ${n.r.stars} · ${ago(n.r.pushed_at)}</span>`}else tip.style.display='none'};
  cv.onmouseleave=()=>{hover=null;$('#tip').style.display='none'};
  cv.onwheel=e=>{e.preventDefault();auto=false;const [sx,sy]=pos(e);const k=Math.max(.3,Math.min(3.5,cam.k*(e.deltaY<0?1.12:.9)));cam.x=sx-(sx-cam.x)*(k/cam.k);cam.y=sy-(sy-cam.y)*(k/cam.k);cam.k=k};
  const onResize=()=>{if(alive){size()}};addEventListener('resize',onResize);
  return{stop(){alive=false;removeEventListener('resize',onResize)},resize:size,fit,zoomBy(f){auto=false;const k=Math.max(.3,Math.min(3.5,cam.k*f));cam.x=W/2-(W/2-cam.x)*(k/cam.k);cam.y=H/2-(H/2-cam.y)*(k/cam.k);cam.k=k},
    setFilter(fn){filt=fn},select(full,focus){sel=full?idx[full]:null;if(sel&&focus){alpha=Math.max(alpha,.1)}}};
}

/* ---------- read a repo ---------- */
function readView(){
  app.innerHTML=`<h2>Read a repo</h2><p class="sub">Highlights, health, and one-click review of any open PR.</p><div class="panel" style="max-width:680px"><label>Repository</label><input id="rin" list="rl" placeholder="owner/name" value="${esc(SELECTED||'')}"><datalist id="rl"></datalist><div class="row" style="margin-top:16px"><button class="btn primary" onclick="doRead()">Read it</button></div></div><div class="panel hide" id="rout" style="margin-top:18px;max-width:680px"></div>`;
  loadGraph().then(g=>$('#rl').innerHTML=g.repos.map(r=>`<option value="${esc(r.full_name)}">`).join('')).catch(()=>{});
}
async function doRead(){const v=$('#rin').value.trim();if(!v)return;const full=v.includes('/')?v:ME.login+'/'+v;setCtx(full);const o=$('#rout');o.classList.remove('hide');o.innerHTML='<div id="d2"></div>';readInto(full,'#d2')}

/* ---------- build / review runs ---------- */
function buildView(repo){
  app.innerHTML=`<h2>Create a new feature</h2><p class="sub">Built test-first against the specs in the repo, then opened as a PR with the evidence.</p>
  <div class="panel" style="max-width:740px"><label>Repository · needs write access and a specs/ folder</label><input id="brepo" list="rl2" value="${esc(repo||SELECTED||'')}" placeholder="owner/name"><datalist id="rl2"></datalist>
  <label>What should it do?</label><textarea id="bfeat" placeholder="e.g. add audience (aud) claim validation to decode"></textarea>
  <div class="row" style="margin-top:18px"><button class="btn primary" id="bgo" onclick="startBuild()">Start build</button></div><div id="berr"></div></div>`;
  loadGraph().then(g=>$('#rl2').innerHTML=g.repos.filter(r=>r.write).map(r=>`<option value="${esc(r.full_name)}">`).join('')).catch(()=>{});
}
async function startBuild(){
  const repo=$('#brepo').value.trim(),feature=$('#bfeat').value.trim();if(!repo||!feature){$('#berr').innerHTML='<div class="notice">Pick a repo and describe the feature.</div>';return}
  $('#bgo').disabled=true;try{const r=await post('/api/build',{repo,feature});openRun(r.run_id)}catch(e){$('#berr').innerHTML=`<div class="notice">${esc(e.message)}</div>`;$('#bgo').disabled=false}
}
async function startReview(repo,pr){try{const r=await post('/api/review',{repo,pr,comment:false});closeDrawer();openRun(r.run_id)}catch(e){alert(e.message)}}

const STAGES={build:[['ticket','Request'],['spec','Spec'],['plan','Plan'],['tests_red','Tests red'],['implement','Implement'],['tests_green','Green'],['inspect','Inspect'],['pr','PR'],['human_review','Review'],['merged','Merged']],
 review:[['received','Received'],['map_clauses','Map clauses'],['generate_tests','Generate'],['run_tests','Run'],['verdict','Verdict'],['comment','Comment']]};
async function openRun(id){
  if(ES){ES.close()} if(GR){GR.stop();GR=null} closeDrawer(); app.classList.remove('wide');
  const info=await api('/api/runs/'+id),kind=info.run.kind;
  app.innerHTML=`<h2>${kind==='build'?'✦ '+esc(info.run.feature):'◎ Review '+esc(info.run.feature)}</h2><p class="sub mono" style="font-size:12.5px">${esc(info.run.repo)} · run ${esc(id)}</p>
  <div class="rail" id="rail">${STAGES[kind].map(([k,l])=>`<span class="st2" data-s="${k}">${l}</span>`).join('')}</div><div class="feed" id="feed"></div>`;
  const ctx={clauses:{},id};ES=new EventSource('/api/runs/'+id+'/stream');
  ES.onmessage=m=>render(JSON.parse(m.data),ctx);ES.addEventListener('end',()=>{ES.close();ES=null});
}
function rail(e){
  const el=document.querySelector(`.st2[data-s="${e.stage}"]`);if(!el)return;
  const all=[...document.querySelectorAll('.st2')],idx=all.indexOf(el);all.slice(0,idx).forEach(p=>{if(!p.classList.contains('failed'))p.className='st2 done'});
  el.className='st2 '+({started:'active',progress:'active',done:'done',failed:'failed',waiting_human:'wait'}[e.status]||'active');
}
const clauseHtml=c=>`<div class="clause"><span class="lv ${esc((c.level||'').replace(' ',''))}">${esc(c.level)}</span><b>${esc(c.id)}</b> <span class="meta">${esc(c.source)}</span><q>“${esc(c.quote)}”</q><span class="meta">${esc(c.requirement||'')}</span></div>`;
function add(html,cls=''){const f=$('#feed');const d=document.createElement('div');d.className='ev '+cls;d.innerHTML=html;f.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'nearest'});return d}
function render(e,ctx){
  rail(e);const d=e.data||{};
  if(e.status==='progress'&&!d.diff_preview&&!d.violations)return add(`<div class="t">· ${esc(e.title)} <span class="muted">${esc(e.detail)}</span></div>`,'small');
  if(e.status==='started')return add(`<div class="t">… ${esc(e.title)}</div>`,'small');
  if(d.clauses)d.clauses.forEach(c=>ctx.clauses[c.id]=c);
  if(e.stage==='spec'&&e.status==='waiting_human'){
    document.querySelectorAll('.gate[data-g=spec]').forEach(x=>x.remove());
    const g=add(`<div class="t">📜 ${esc(e.title)}</div><div class="d">Every quote is verbatim from the repo's specs. Approve to write the tests first.</div>${(d.clauses||[]).map(clauseHtml).join('')}
      <textarea id="specEdit" placeholder="Want changes? e.g. also cover an empty audience list"></textarea>
      <div class="row" style="margin-top:12px"><button class="btn good" onclick='gate(${JSON.stringify(ctx.id)},"spec","approve",this)'>Approve spec</button>
      <button class="btn" onclick='gate(${JSON.stringify(ctx.id)},"spec","edit",this,"specEdit")'>Edit clauses</button></div>`,'gate');g.dataset.g='spec';return}
  if(e.stage==='spec'&&e.status==='done'){document.querySelectorAll('.gate[data-g=spec]').forEach(x=>x.remove());return add(`<div class="t">📜 ${esc(e.title)}</div>${(d.clauses||[]).map(clauseHtml).join('')}`)}
  if(e.stage==='tests_red'&&e.status==='done'){
    add(`<div class="t big" style="color:var(--red)">🔴 ${esc(e.title)}</div><div class="d">${esc(e.detail)}</div>`,'red');
    (d.tests||[]).forEach(t=>{const c=ctx.clauses[t.clause_id]||{};add(`<div class="t" style="color:var(--red)">✘ ${esc(t.clause_id)} <span class="muted mono">${esc((t.name||'').split('::').pop())}</span></div><q class="d" style="display:block">“${esc(c.quote||'')}”</q><div class="out">${esc(t.output_snippet)}</div>`,'red')});return}
  if(e.stage==='implement'&&d.diff_preview)return add(`<div class="t">🔥 ${esc(e.title)} <span class="muted mono">${esc(e.detail)}</span></div><div class="diff">${d.diff_preview.split('\n').map(l=>`<div class="${l.startsWith('+')&&!l.startsWith('+++')?'p':l.startsWith('-')&&!l.startsWith('---')?'m':''}">${esc(l)}</div>`).join('')}</div>`);
  if(e.stage==='tests_green'&&d.evidence){add(`<div class="t big" style="color:var(--green)">🟢 ${esc(e.title)}</div><div class="d">${esc(e.detail)}</div>`,'green');
    d.evidence.forEach(r=>add(`<div class="t" style="color:var(--green)">✔ ${esc(r.clause_id)} <span class="muted">${esc(r.source)}</span> <span class="muted mono">${esc(r.test)}</span></div><div class="flip"><div class="b">❌ ${esc(r.before)}</div><div>→</div><div class="a">✅ ${esc(r.after)}</div></div>`,'green'));return}
  if(d.violations&&d.violations.length){
    d.violations.forEach(v=>add(`<h4>VIOLATION PROVEN BY A FAILING TEST</h4><div><span class="lv MUST">SPEC</span><b>${esc(v.clause_id)}</b> <span class="meta muted">${esc(v.source)}</span></div><q>“${esc(v.quote)}”</q>
      <div class="muted mono" style="font-size:12px">failing test · ${esc(v.test_name)}</div><div class="out">${esc(v.output_snippet)}</div>${v.suggested_fix?`<div class="d"><b>Suggested fix:</b> ${esc(v.suggested_fix)}</div>`:''}`,'violation'));return}
  if(e.stage==='inspect'&&e.status==='done')return add(`<div class="t" style="color:var(--green)">🕵️ ${esc(e.title)} <span class="muted">${esc(e.detail)}</span></div>`,'green');
  if(e.stage==='pr'&&e.status==='done'&&d.pr_url)return add(`<div class="t big">🍽️ ${esc(e.title)}</div><div class="d">${esc(e.detail&&!e.detail.startsWith('http')?e.detail:'')}</div><div class="row" style="margin-top:10px"><a class="btn primary" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(d.pr_url)}">Open the PR on GitHub ↗</a></div>`,'green');
  if(e.stage==='human_review'&&e.status==='waiting_human'){document.querySelectorAll('.gate[data-g=review]').forEach(x=>x.remove());
    const g=add(`<div class="t">💬 ${esc(e.title)}</div><div class="d">Approve to squash-merge, or ask for changes — SpecGuard revises, re-proves and pushes a new round to the same PR.</div>
      <textarea id="revEdit" placeholder="e.g. also validate the issuer (iss) claim"></textarea><div class="row" style="margin-top:12px"><button class="btn good" onclick='gate(${JSON.stringify(ctx.id)},"review","approve",this)'>Approve &amp; merge</button>
      <button class="btn" onclick='gate(${JSON.stringify(ctx.id)},"review","changes",this,"revEdit")'>Request changes</button></div>`,'gate');g.dataset.g='review';return}
  if(e.stage==='human_review'&&e.status==='done'){document.querySelectorAll('.gate[data-g=review]').forEach(x=>x.remove());return add(`<div class="t">💬 ${esc(e.title)} <span class="muted">${esc(e.detail)}</span></div>`,'small')}
  if(e.stage==='comment'&&d.body&&!d.pr_url)return add(`<div class="t">💬 ${esc(e.title)}</div><div class="d">Nothing is posted to GitHub unless you choose to.</div><div class="row" style="margin-top:10px"><button class="btn primary" onclick='postReview(${JSON.stringify(ctx.id)},this)'>Post review to the PR</button></div>`);
  if(e.stage==='comment'&&d.pr_url)return add(`<div class="t" style="color:var(--green)">✔ ${esc(e.title)}</div><div class="row" style="margin-top:8px"><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(d.pr_url)}">View on GitHub ↗</a></div>`,'green');
  if(e.stage==='merged')return add(`<div class="t big" style="color:var(--green)">🔔 ${esc(e.title)}</div>`,'green');
  if(e.stage==='verdict')return add(`<div class="t big" style="${e.status==='failed'||(d.violations&&d.violations.length)?'color:var(--red)':'color:var(--green)'}">⚖️ ${esc(e.title)}</div><div class="d">${esc(e.detail)}</div>`,(d.violations&&d.violations.length)?'red':'green');
  const bad=e.status==='failed';
  add(`<div class="t" ${bad?'style="color:var(--red)"':''}>${bad?'✘':'✔'} ${esc(e.title)}</div>${e.detail?`<div class="d">${esc(e.detail)}</div>`:''}`,bad?'red':'');
}
async function postReview(id,btn){btn.disabled=true;try{await post(`/api/runs/${id}/comment`,{})}catch(e){alert(e.message);btn.disabled=false}}
async function gate(id,name,decision,btn,taId){
  const text=taId?$('#'+taId).value.trim():'';if(decision!=='approve'&&!text){alert('Tell SpecGuard what to change.');return}
  btn.disabled=true;try{await post(`/api/runs/${id}/gate`,{name,decision,text})}catch(e){alert(e.message);btn.disabled=false}
}

/* ---------- chat ---------- */
function toggleChat(){const c=$('#chat');c.classList.toggle('open');if(c.classList.contains('open')&&!CHAT.length)bubble('a',`Hi ${ME.name.split(' ')[0]}! Ask about a repo, how a run works, or what to build first.`)}
function bubble(r,t){CHAT.push({role:r==='u'?'user':'assistant',text:t});const m=document.createElement('div');m.className='m '+r;m.textContent=t;$('#msgs').appendChild(m);$('#msgs').scrollTop=1e9;return m}
async function sendChat(e){e.preventDefault();const i=$('#chatIn'),t=i.value.trim();if(!t)return;i.value='';bubble('u',t);const w=bubble('a','…');
  try{const r=await post('/api/chat',{message:t,repo:SELECTED,history:CHAT.slice(0,-2)});w.textContent=r.reply;CHAT[CHAT.length-1].text=r.reply}catch(x){w.textContent='Sorry — '+x.message}}
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
init();
</script>
